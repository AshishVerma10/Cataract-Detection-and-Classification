<!DOCTYPE html>
<html lang="en">
<head>
    <title>Netra | Upload Image</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            background: #f4f7fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.1);
        }

        .btn-primary {
            border-radius: 25px;
        }

        .preview-img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h2>👁️ Cataract Detection System</h2>
        <p class="text-muted">Upload a retinal image to analyze for cataract presence.</p>
    </div>

    <div class="row">

        <!-- Upload Section -->
        <div class="col-md-6">
            <div class="card p-4">
                <h4>📤 Upload Image</h4>

                <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" class="form-control mt-3" required>
                    <button type="submit" class="btn btn-primary mt-3 btn-block">
                        Upload Image
                    </button>
                </form>
            </div>
        </div>

        <!-- Preview Section -->
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <h4>🖼 Uploaded Image</h4>

                {% if user_image %}
                    <img src="{{ url_for('static', filename='inputimages/' + user_image) }}"
                         class="preview-img">
                    
                    <form action="{{ url_for('prediction', file=user_image) }}" method="post">
                        <button type="submit" class="btn btn-success mt-3 btn-block">
                            🔍 Analyze Image
                        </button>
                    </form>
                {% else %}
                    <p class="text-muted mt-3">No image uploaded yet.</p>
                {% endif %}
            </div>
        </div>

    </div>
</div>

</body>
</html>
